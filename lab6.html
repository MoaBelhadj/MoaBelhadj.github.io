<head>

<body>

    <section id = header>

        
        <h1 class = "title">Facts About cats!</h1>
        <h5 class = 'subtitle'>This is the lab 6 Page</h2>
        <br>
        <nav class = "navbars">
            <a class="navbarsint" href="index.html">Lab2 Page</a>
            <a class="navbarsint" href="lab3.html">Lab3 Page</a>
            <a class="navbarsint" href="lab4.html">Lab4 Page</a>
            <a class="navbarsint" href="lab5.html">Lab5 Page</a>
        </nav>

    <div class="container">

      <div class="image-container">
    <img id="catImage"/>
      </div>

      <button id="fetchButton" onclick="fetchCatFacts()">Get Cat Facts</button>

      <table id="factsTable">
        <thead>
          <tr>
            
          </tr>
        </thead>
        <tbody id="factsTable">
         
        </tbody>
      </table>
    </div>
    <script>
        const url = "https://brianobruno.github.io/cats.json";
        const options = {
        method: "GET",
        };

        const catImage = document.getElementById("catImage");
        const fetchButton = document.getElementById("fetchButton");
        const factsTable = document.getElementById("factsTable");

        async function fetchCatFacts() {
            try {
                const response = await fetch(url, options);
                const result = await response.text();
                myObj = JSON.parse(result);

                const sortedFacts = myObj.facts.sort((a, b) => a.factId - b.factId);

                factsTable.innerHTML = "";

                sortedFacts.forEach((fact) => {
                    const row = factsTable.insertRow();
                    const idCell = row.insertCell();
                    const factCell = row.insertCell();
                    idCell.textContent = fact.factId;
                    factCell.textContent = fact.text;
                });

                catImage.src = myObj.catPhoto;
                } catch (error) {
                console.log("error", error);
                }
            }
    </script>
  </body>
