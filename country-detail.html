<!DOCTYPE html>
<html lang="en">
<head>
    <title>Country Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div style="max-width: 800px; margin: 20px auto; padding: 0 20px;">
        <a href="countries.html" style=" margin-bottom: 20px;">Back</a>
        <div id="countryDetail"></div>
    </div>

    <script>
        async function cdetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const countryName = urlParams.get('name');
            const response = await fetch(`https://restcountries.com/v3.1/name/${encodeURIComponent(countryName)}?fullText=true`);
            const data = await response.json();
            const country = data[0];
            dcdetail(country);
        }

        function dcdetail(country) {
            const detailDiv = document.getElementById('countryDetail');
            const currencies = country.currencies ? Object.values(country.currencies).map(c => c.name).join(', ') : 'N/A';
            const languages = country.languages ? Object.values(country.languages).join(', ') : 'N/A';
            
            detailDiv.innerHTML = 
                `
                <div class="country-detail text-center text-3xl" >
                <h1 style="text-align: center; font-size: 48px;">${country.name.official}</h1>
                <br>
                <img src="${country.flags.png}"  style="display: block; margin: 0 auto; max-width: 300px; margin-bottom: 20px;">
                <br>
                <p><b>Capital:</b> ${country.capital?.[0] }</p>
                <p><b>Population:</b> ${country.population.toString()}</p>
                <p><b>Region:</b> ${country.region}</p>
                <p><b>Subregion:</b> ${country.subregion}</p>
                <p><b>Area:</b> ${country.area.toString()} km²</p>
                <p><b>Currency:</b> ${currencies}</p>
                <p><b>Languages:</b> ${languages}</p>
                </div>
            `;
        }

        cdetail();
        
    </script>
    <br><br>
    <div class="footer justify-end">
    <hr>
    <p class="text-right text-3xl">This was made by <b>Adam Belhadj</b></p>
    </div>
</body>
</html>
