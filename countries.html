<!DOCTYPE html>
<html>
<head>

<title>Countries</title>
</head>
<body>
    <div style="max-width: 1200px; margin: 20px auto; padding: 0 20px;">
        <h1 style="text-align: center;">World Countries</h1>
        <input type="text" id="searchInput" placeholder="Search" style="width: 100%; padding: 8px; margin: 10px 0; border: 1px solid #ccc;">
        <div id="countriesGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px;"></div>
    </div>

    <script>
        let countrie = [];

        async function fetcountry() {
            const response = await fetch('https://restcountries.com/v3.1/all?fields=name,flags,capital,population');
            countrie = await response.json();
            discountries(countrie);
        }

        function discountries(countries) {
            const grid = document.getElementById('countriesGrid');
            grid.innerHTML = '';
            const cards = [];
            for (const country of countries) {
                const card = document.createElement('div');
                card.style.cssText = 'border: 1px solid #ccc; padding: 10px; text-align: center;';
                card.onclick = () => window.location.href = `country-detail.html?name=${encodeURIComponent(country.name.common)}`;
                
                card.innerHTML = `
                    <img src="${country.flags.png }" style="width: 60px; height: 40px; margin: 0 auto 5px; display: block;">
                    <h3 style="margin: 5px 0;">${country.name.common}</h3>
                `;
                cards.push(card);
            }
            grid.append(...cards);
        }

        function filterCountries() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = countrie.filter(country => country.name.common.toLowerCase().includes(searchTerm));
            discountries(filtered);
        }

        document.getElementById('searchInput').addEventListener('input', filterCountries);

        fetcountry();
    </script>
</body>
</html>
